version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: personaldns-postgres
    environment:
      POSTGRES_DB: personaldns
      POSTGRES_USER: pdnsuser
      POSTGRES_PASSWORD: pdns_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./powerdns/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdnsuser -d personaldns"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personaldns-net

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: personaldns-redis
    command: redis-server --requirepass redis_secure_password_123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personaldns-net

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: personaldns-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personaldns-net

  # PowerDNS Authoritative Server
  powerdns:
    image: pschiffe/pdns:latest
    container_name: personaldns-pdns
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PDNS_API_KEY: pdns_api_key_secure_123
      PDNS_ALLOW_AXFR_FROM: 0.0.0.0/0
      PDNS_LOCAL_ADDRESS: 0.0.0.0
      PDNS_LOCAL_PORT: 53
      PDNS_MASTER: "yes"
      PDNS_SLAVE: "no"
      PDNS_GMYSQL_HOST: postgres
      PDNS_GMYSQL_PORT: 5432
      PDNS_GMYSQL_DBNAME: personaldns
      PDNS_GMYSQL_USER: pdnsuser
      PDNS_GMYSQL_PASSWORD: pdns_secure_password_123
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8081:8081"
    volumes:
      - ./powerdns/pdns.conf:/etc/pdns/pdns.conf:ro
    networks:
      - personaldns-net

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: personaldns-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      powerdns:
        condition: service_started
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql://pdnsuser:pdns_secure_password_123@postgres:5432/personaldns
      REDIS_URL: redis://:redis_secure_password_123@redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      POWERDNS_API_URL: http://powerdns:8081
      POWERDNS_API_KEY: pdns_api_key_secure_123
      SECRET_KEY: your-very-secure-secret-key-change-this-in-production
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - personaldns-net

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: personaldns-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - personaldns-net

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: personaldns-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - personaldns-net

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: personaldns-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - personaldns-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  personaldns-net:
    driver: bridge
